<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Forge mark: the writer's dot (rev E). Static — never animated. -->
  <defs>
    <radialGradient id="dot" cx="40%" cy="35%" r="78%">
      <stop offset="0%" stop-color="#FFC940"/>
      <stop offset="45%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#E62E0F"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="16" cy="16" r="10" fill="url(#dot)" filter="url(#glow)"/>
</svg>
